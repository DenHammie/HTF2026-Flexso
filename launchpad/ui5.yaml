# Oakhaven local launchpad — NOT an app: the Fiori launchpad (sandbox) that shows a tile for
# every UI5 app under src/. Served at /launchpad/ via the "oakhaven-launchpad" dependency in the
# root package.json. Tiles come from /appconfig/fioriSandboxConfig.json (srv/server.ts).
specVersion: "3.0"
metadata:
  name: oakhaven.launchpad
type: application
customConfiguration:
  cds-plugin-ui5:
    mountPath: /launchpad
framework:
  name: SAPUI5
  version: "1.136.0"
  libraries:
    - name: sap.m
    - name: sap.ushell
    - name: sap.ui.core
    - name: sap.f
    - name: sap.ui.layout
    - name: sap.tnt
    - name: sap.ui.unified
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        transformTypeScript: true
        altTsConfig: ../tsconfig.json
